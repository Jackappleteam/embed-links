name = "embed-links"
main = "worker.js"
compatibility_date = "2024-11-01"

# Run `npx wrangler kv namespace create EMBEDS` and paste the id it prints here.
[[kv_namespaces]]
binding = "EMBEDS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Discord OAuth app (from https://discord.com/developers/applications).
# Client ID is not secret — fine to commit. Client secret is NOT set here:
# run `npx wrangler secret put DISCORD_CLIENT_SECRET` once instead.
[vars]
DISCORD_CLIENT_ID = "PASTE_DISCORD_CLIENT_ID_HERE"
